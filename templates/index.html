<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento - Studio Karine Luna</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0a0a0a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }
        .container {
            background-color: #141414;
            padding: 40px 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .logo-container {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo-container img {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 2px solid #d4af37;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
            object-fit: cover;
        }
        label.campo {
            display: block;
            margin-top: 20px;
            color: #d4af37;
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        input[type="text"], input[type="date"], input[type="time"] {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #333;
            background: #1e1e1e;
            color: white;
            box-sizing: border-box;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus, input[type="date"]:focus, input[type="time"]:focus {
            border-color: #d4af37;
            outline: none;
        }
        /* Estilo da caixa de múltiplos serviços */
        .servicos-lista {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #333;
            max-height: 180px;
            overflow-y: auto;
        }
        .servicos-lista::-webkit-scrollbar {
            width: 6px;
        }
        .servicos-lista::-webkit-scrollbar-thumb {
            background: #d4af37;
            border-radius: 4px;
        }
        .servico-item {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #2a2a2a;
        }
        .servico-item:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }
        .servico-item input[type="checkbox"] {
            margin-right: 12px;
            transform: scale(1.3);
            cursor: pointer;
            accent-color: #d4af37; /* Deixa a caixinha dourada quando marcada */
        }
        .servico-item label {
            cursor: pointer;
            color: #ccc;
            font-size: 0.95rem;
            width: 100%;
            display: flex;
            justify-content: space-between;
        }
        .servico-preco {
            color: #d4af37;
        }
        button {
            width: 100%;
            padding: 18px;
            margin-top: 30px;
            background-color: #d4af37;
            color: #000000;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
        }
        button:hover {
            background-color: #bfa030;
        }
        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <img src="/static/logo.png" alt="Studio Karine Luna" onerror="this.src='https://via.placeholder.com/160/0a0a0a/d4af37?text=KL'">
        </div>
        
        <form action="/pagamento" method="POST">
            <label class="campo">Seu Nome</label>
            <input type="text" name="nome" required placeholder="Seu nome completo">

            <label class="campo">Procedimento</label>
            <div class="servicos-lista">
                {% for servico, preco in servicos.items() %}
                <div class="servico-item">
                    <input type="checkbox" name="procedimentos" value="{{ servico }}" id="srv_{{ loop.index }}">
                    <label for="srv_{{ loop.index }}">
                        <span>{{ servico }}</span>
                        <span class="servico-preco">R$ {{ "%.2f"|format(preco) }}</span>
                    </label>
                </div>
                {% endfor %}
            </div>

            <label class="campo">Data</label>
            <input type="date" name="data" required>

            <label class="campo">Hora</label>
            <input type="time" name="hora" required>

            <button type="submit">Confirmar Agendamento</button>
        </form>
    </div>
</body>
</html>
