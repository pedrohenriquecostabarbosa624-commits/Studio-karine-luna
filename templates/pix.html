<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Pagamento Pix</title>
</head>
<body>
    <h1>Pagamento via Pix</h1>
    <p>Olá <strong>{{ nome }}</strong>, o valor do seu procedimento é R$ {{ valor_total }}.</p>
    <img src="data:image/png;base64,{{ qr_code_img }}" alt="QR Code Pix">
    <p>Após realizar o pagamento, clique abaixo para confirmar:</p>
    <a href="https://api.whatsapp.com/send?phone=5568999900690&text={{ mensagem_wpp }}" target="_blank" style="padding: 15px; background-color: #25D366; color: white; text-decoration: none; border-radius: 5px;">
        ✅ Já paguei! Enviar comprovante
    </a>
</body>
</html>
